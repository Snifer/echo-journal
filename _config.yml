title: "Proyecto ECCO"
description: "Un juego de viajes en el tiempo en Solitario"
baseurl: "/echo-journal"
url: "https://snifer.github.io"

markdown: kramdown
highlighter: rouge
permalink: /diario/:year/:month/:day/:title/
future: false

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
