title: "Project Echo - Diario"
description: "Bitá·ªcora de aventuras de Project Echo"
baseurl: ""  # Cambia a "/nombre-del-repo" si usas user.github.io/nombre-repo
url: "https://tu-usuario.github.io"

# Configuraci├│n de Jekyll
markdown: kramdown
highlighter: rouge
permalink: /diario/:year/:month/:day/:title/

# No mostrar posts con fecha futura
future: false

# Configuraci├│n de colecciones
collections:
  posts:
    output: true

# Valores por defecto para posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Configuraci├│n de build
include:
  - _posts

exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
