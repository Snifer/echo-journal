---
layout: default
---

<article class="post">
  <header class="post-header">
    <h2 class="post-title">{{ page.title }}</h2>
    <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
      {{ page.date | date: "%d de %B de %Y" }}
    </time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="post-tags">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}

  <nav class="post-navigation">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; Volver al calendario</a>
  </nav>
</article>
